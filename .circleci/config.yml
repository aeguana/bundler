version: 2.1

# Set by upstream project repos when they trigger this pipeline through the
# CircleCI API. Empty on ordinary pushes to this repo.
parameters:
  project:
    type: string
    default: ""
  version:
    type: string
    default: ""
  package:
    type: string
    default: ""

executors:
  base:
    docker:
      - image: cimg/base:current

jobs:
  update-manifest:
    executor: base
    steps:
      - checkout
      - run:
          name: Bump manifest and open PR into main
          command: |
            scripts/qa_bundle.sh \
              "<< pipeline.parameters.project >>" \
              "<< pipeline.parameters.version >>" \
              "<< pipeline.parameters.package >>"

  run-HIL-test:
    executor: base
    steps:
      - checkout
      - run: scripts/hil_test.sh

  integration-tests:
    executor: base
    steps:
      - checkout
      - run: scripts/integration_tests.sh

  deploy:
    executor: base
    steps:
      - checkout
      - run: scripts/deploy.sh

workflows:
  # Upstream trigger. Opens the QA PR and stops — pushing the qa/ branch is
  # what starts the qa-checks pipeline below.
  open-qa-pr:
    when:
      not:
        equal: ["", << pipeline.parameters.project >>]
    jobs:
      - update-manifest:
          context: bundler-github

  # Runs against the qa/ branch itself, so these show up as checks on the PR
  # in GitHub rather than being buried in the upstream repo's pipeline.
  qa-checks:
    when:
      equal: ["", << pipeline.parameters.project >>]
    jobs:
      - run-HIL-test:
          filters: &qa-branches
            branches:
              only: /^qa\/.*/

      - integration-tests:
          filters: *qa-branches

      - hold-for-manual-test:
          type: approval
          filters: *qa-branches

      - deploy:
          filters: *qa-branches
          requires:
            - run-HIL-test
            - integration-tests
            - hold-for-manual-test
